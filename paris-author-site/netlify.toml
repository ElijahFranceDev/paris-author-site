# Ensure dependencies such as pg are installed before Netlify packages functions.
# The site's base/publish directories remain set in the Netlify project.
[build]
  command = "npm install --no-audit --no-fund"

# Inventory-backed functions bundle the PostgreSQL driver inside the deployed Lambda.
# This file intentionally doesn't override the existing Netlify UI build or publish paths.
[functions."pmf-admin-products"]
  node_bundler = "esbuild"

[functions."pmf-store-products"]
  node_bundler = "esbuild"

[functions."pmf-square-checkout"]
  node_bundler = "esbuild"

[functions."pmf-square-inventory-webhook"]
  node_bundler = "esbuild"

[functions."pmf-reconcile-checkouts"]
  node_bundler = "esbuild"

[functions."pmf-inventory-health"]
  node_bundler = "esbuild"
